<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" style="background:#fafafa;font-family:ui-monospace,SFMono-Regular,monospace">
<defs>
  <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0,1 8,3.5 0,6" fill="none" stroke="#444" stroke-width="1.4" stroke-linejoin="round"/>
  </marker>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto-start-reverse">
    <polyline points="8,1 0,3.5 8,6" fill="none" stroke="#888" stroke-width="1.4" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, monospace; fill: #111; font-size: 12px; }
    .t { font-weight: 600; font-size: 13px; }
    .d { fill: #888; font-size: 10px; }
    .fl { stroke-dasharray: 7 4; animation: f .8s linear infinite; }
    @keyframes f { to { stroke-dashoffset: -11; } }
  </style>
</defs>

<!-- Zone backgrounds -->
<rect x="0" y="0" width="380" height="300" fill="#f3f3f3" rx="0"/>
<rect x="380" y="0" width="380" height="300" fill="#fafafa" rx="0"/>
<line x1="380" y1="0" x2="380" y2="300" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
<text x="16" y="20" class="d" style="font-size:9px;text-transform:uppercase;letter-spacing:0.8px">Slack infrastructure</text>
<text x="396" y="20" class="d" style="font-size:9px;text-transform:uppercase;letter-spacing:0.8px">your cloud</text>

<!-- Slack -->
<rect x="22" y="100" width="86" height="46" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.7" filter="url(#sk)"/>
<text x="65" y="119" text-anchor="middle" class="t">Slack</text>
<text x="65" y="135" text-anchor="middle" class="d">workspace</text>

<!-- Arrow Slack → Gateway -->
<path d="M111 123 C140 123 168 123 198 123" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)" class="fl"/>
<text x="154" y="114" text-anchor="middle" class="d">HTTPS</text>

<!-- Gateway -->
<rect x="202" y="72" width="148" height="104" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.7" filter="url(#sk)"/>
<text x="276" y="98" text-anchor="middle" class="t">Gateway</text>
<text x="276" y="116" text-anchor="middle" class="d">Cloudflare Worker</text>
<text x="276" y="132" text-anchor="middle" class="d">session table</text>
<text x="276" y="148" text-anchor="middle" class="d">secrets · GitHub tokens</text>
<text x="276" y="164" text-anchor="middle" class="d">event dedup</text>

<!-- WebSocket (bidirectional, host dials out) -->
<path d="M352 123 C390 123 440 123 476 123" stroke="#888" stroke-width="1.4" fill="none" marker-start="url(#ar)" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="414" y="113" text-anchor="middle" class="d">WebSocket</text>
<text x="414" y="140" text-anchor="middle" class="d" font-style="italic">host dials outbound</text>

<!-- Calvin Host VM -->
<rect x="480" y="72" width="148" height="104" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.7" filter="url(#sk)"/>
<text x="554" y="98" text-anchor="middle" class="t">Calvin Host</text>
<text x="554" y="116" text-anchor="middle" class="d">Azure VM / EC2</text>
<text x="554" y="132" text-anchor="middle" class="d">git worktrees</text>
<text x="554" y="148" text-anchor="middle" class="d">oc-modelproxy</text>
<text x="554" y="164" text-anchor="middle" class="d">runner pool</text>

<!-- per-thread label -->
<text x="554" y="195" text-anchor="middle" class="d">per thread ↓</text>

<!-- Arrows Host → Containers -->
<path d="M524 180 C510 204 496 215 486 226" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M584 180 C598 204 614 215 626 226" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

<!-- Container 1 -->
<rect x="398" y="230" width="144" height="58" rx="8" fill="#f8f8ff" stroke="#555" stroke-width="1.5" filter="url(#sk)"/>
<text x="470" y="252" text-anchor="middle" class="t" style="font-size:12px">Container</text>
<text x="470" y="268" text-anchor="middle" class="d">Claude Code</text>
<text x="470" y="281" text-anchor="middle" class="d">rootless Podman</text>

<!-- Container 2 -->
<rect x="556" y="230" width="144" height="58" rx="8" fill="#f8f8ff" stroke="#555" stroke-width="1.5" filter="url(#sk)"/>
<text x="628" y="252" text-anchor="middle" class="t" style="font-size:12px">Container</text>
<text x="628" y="268" text-anchor="middle" class="d">Codex · OpenCode</text>
<text x="628" y="281" text-anchor="middle" class="d">rootless Podman</text>

</svg>
