<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" style="background:#fafafa;font-family:ui-monospace,SFMono-Regular,monospace">
<defs>
  <filter id="sk" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.030" numOctaves="3" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0,1 8,3.5 0,6" fill="none" stroke="#444" stroke-width="1.3" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, monospace; fill: #111; font-size: 11px; }
    .t { font-weight: 600; font-size: 12px; }
    .d { fill: #999; font-size: 10px; }
    .wait { stroke-dasharray: 6 4; animation: f .9s linear infinite; }
    @keyframes f { to { stroke-dashoffset: -10; } }
  </style>
</defs>

<!-- Row 1 label -->
<text x="10" y="52" class="d" style="font-size:9px;text-transform:uppercase;letter-spacing:0.7px">normal message</text>

<!-- Row 1: normal message path -->
<!-- you type -->
<rect x="10" y="60" width="78" height="34" rx="10" fill="#fff" stroke="#333" stroke-width="1.5" filter="url(#sk)"/>
<text x="49" y="82" text-anchor="middle" class="t">you type</text>

<!-- arrow solid -->
<path d="M91 77 L133 77" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

<!-- queued -->
<rect x="136" y="60" width="78" height="34" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="1.5" filter="url(#sk)"/>
<text x="175" y="82" text-anchor="middle" class="t">queued</text>

<!-- dashed arrow (waiting) -->
<path d="M217 77 L276 77" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#a)" class="wait"/>
<text x="247" y="68" text-anchor="middle" class="d">waiting…</text>

<!-- tool ends -->
<rect x="279" y="60" width="88" height="34" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="1.5" filter="url(#sk)"/>
<text x="323" y="82" text-anchor="middle" class="t">tool ends</text>

<!-- arrow solid -->
<path d="M370 77 L418 77" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

<!-- agent reads -->
<rect x="421" y="60" width="98" height="34" rx="10" fill="#edf7ee" stroke="#4a9e5a" stroke-width="1.5" filter="url(#sk)"/>
<text x="470" y="82" text-anchor="middle" class="t" style="fill:#2d6e3a">agent reads</text>

<!-- Row 1 annotation -->
<text x="300" y="116" text-anchor="middle" class="d">picked up at the next tool boundary</text>

<!-- Separator -->
<line x1="10" y1="130" x2="610" y2="130" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="3 5"/>

<!-- Row 2 label -->
<text x="10" y="148" class="d" style="font-size:9px;text-transform:uppercase;letter-spacing:0.7px">!! interrupt</text>

<!-- Row 2: hard interrupt path -->
<!-- !! text -->
<rect x="10" y="156" width="78" height="34" rx="10" fill="#fff" stroke="#333" stroke-width="1.5" filter="url(#sk)"/>
<text x="49" y="178" text-anchor="middle" class="t">!! text</text>

<!-- fast arrow -->
<path d="M91 173 L150 173" stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="120" y="164" text-anchor="middle" class="d">~1 s</text>

<!-- interrupt signal -->
<rect x="153" y="156" width="88" height="34" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="1.5" filter="url(#sk)"/>
<text x="197" y="178" text-anchor="middle" class="t">interrupt</text>

<!-- arrow -->
<path d="M244 173 L302 173" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)"/>

<!-- new turn -->
<rect x="305" y="156" width="88" height="34" rx="10" fill="#edf7ee" stroke="#4a9e5a" stroke-width="1.5" filter="url(#sk)"/>
<text x="349" y="178" text-anchor="middle" class="t" style="fill:#2d6e3a">new turn</text>

<!-- Row 2 annotation -->
<text x="230" y="208" text-anchor="middle" class="d">current turn abandoned, starts fresh</text>

</svg>
