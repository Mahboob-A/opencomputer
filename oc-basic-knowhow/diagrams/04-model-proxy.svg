<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" style="background:#fafafa;font-family:ui-monospace,SFMono-Regular,monospace">
<defs>
  <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polyline points="0,1 8,3.5 0,6" fill="none" stroke="#444" stroke-width="1.3" stroke-linejoin="round"/>
  </marker>
  <marker id="au" markerWidth="7" markerHeight="9" refX="3.5" refY="8" orient="auto">
    <polyline points="1,8 3.5,0 6,8" fill="none" stroke="#888" stroke-width="1.3" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, monospace; fill: #111; font-size: 12px; }
    .t { font-weight: 600; font-size: 13px; }
    .d { fill: #888; font-size: 10px; }
    .fl { stroke-dasharray: 6 4; animation: f .8s linear infinite; }
    @keyframes f { to { stroke-dashoffset: -10; } }
  </style>
</defs>

<!-- Session container box -->
<rect x="18" y="62" width="142" height="106" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.7" filter="url(#sk)"/>
<text x="89" y="88" text-anchor="middle" class="t">Session</text>
<text x="89" y="106" text-anchor="middle" class="d">Claude Code</text>

<!-- No API key badge -->
<rect x="40" y="118" width="98" height="26" rx="6" fill="#fff5f5" stroke="#e0a0a0" stroke-width="1.2" filter="url(#sk)"/>
<text x="89" y="135" text-anchor="middle" style="font-size:11px;fill:#c0392b">✗ no API key</text>

<text x="89" y="158" text-anchor="middle" class="d">env · files · logs</text>

<!-- Arrow Session → Proxy -->
<path d="M163 115 C190 115 208 115 232 115" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)" class="fl"/>
<text x="197" y="107" text-anchor="middle" class="d">socket</text>

<!-- oc-modelproxy box -->
<rect x="235" y="52" width="140" height="128" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.7" filter="url(#sk)"/>
<text x="305" y="80" text-anchor="middle" class="t">oc-modelproxy</text>
<text x="305" y="98" text-anchor="middle" class="d">Go binary</text>
<text x="305" y="114" text-anchor="middle" class="d">socket-activated</text>
<text x="305" y="130" text-anchor="middle" class="d">binds credential</text>
<text x="305" y="146" text-anchor="middle" class="d">per session</text>

<!-- Credential annotation (below proxy) -->
<path d="M305 182 L305 184" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#au)"/>
<text x="305" y="200" text-anchor="middle" class="d">per-session profile</text>
<text x="305" y="214" text-anchor="middle" class="d">credential store</text>

<!-- Arrow Proxy → Anthropic -->
<path d="M377 92 C406 92 420 86 444 83" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)" class="fl"/>

<!-- Arrow Proxy → OpenAI -->
<path d="M377 138 C406 138 420 144 444 147" stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#a)" class="fl"/>

<!-- Anthropic API box -->
<rect x="447" y="62" width="112" height="44" rx="8" fill="#fff" stroke="#444" stroke-width="1.5" filter="url(#sk)"/>
<text x="503" y="81" text-anchor="middle" class="t" style="font-size:12px">Anthropic</text>
<text x="503" y="97" text-anchor="middle" class="d">API</text>

<!-- OpenAI API box -->
<rect x="447" y="122" width="112" height="44" rx="8" fill="#fff" stroke="#444" stroke-width="1.5" filter="url(#sk)"/>
<text x="503" y="141" text-anchor="middle" class="t" style="font-size:12px">OpenAI</text>
<text x="503" y="157" text-anchor="middle" class="d">API</text>

</svg>
